name: vokoma
description: "Vokoma client: media player for Windows and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  # The pinned Flutter release. CI reads it from here (flutter-version-file).
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
