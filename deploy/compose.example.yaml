# M0 runs one container. The recorder and worker return when they have work.
services:
  api:
    image: vokoma:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    command: [api]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./example-media:/media:ro
    environment:
      VOKOMA_HOST: 0.0.0.0
      VOKOMA_CONFIG: /config/config.json
      VOKOMA_DATA_DIRECTORY: /data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/server').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
