name: client

on:
  pull_request:
    paths:
      - tools/release/**
      - tools/windows-updater/**
      - .github/workflows/release.yml
      - apps/client/**
      - .github/workflows/client.yml
  push:
    branches: [main]
    paths:
      - tools/release/**
      - tools/windows-updater/**
      - .github/workflows/release.yml
      - apps/client/**
      - .github/workflows/client.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/client

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/client/pubspec.yaml
          cache: true
      - run: node --test tools/release/release.test.mjs
        working-directory: .
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/client/pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      # PR artifacts have no release secrets and are debug-signed. Never distribute.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vokoma-android-apk
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/client/pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Check the bundled libmpv is the pinned release
        shell: pwsh
        run: |
          $version = (Select-String -Path windows/libmpv.cmake -Pattern 'VOKOMA_LIBMPV_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          $dll = [IO.File]::ReadAllBytes("build/windows/x64/runner/Release/libmpv-2.dll")
          $text = [Text.Encoding]::ASCII.GetString($dll)
          if (-not $text.Contains("mpv v$version")) { throw "libmpv-2.dll is not mpv v$version" }
          Write-Output "libmpv-2.dll is mpv v$version"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows apply recovery
        run: dotnet run --project tools/windows-updater/tests/RecoveryTests.csproj
        working-directory: .
      - id: version
        run: node tools/release/version.mjs
        working-directory: .
      - name: Package per-user Windows installer
        shell: pwsh
        working-directory: .
        run: |
          dotnet publish tools/windows-updater/Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o apps/client/build/windows/x64/runner/Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --tool-path .vpk vpk --version 1.2.161
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .vpk/vpk.exe pack --packId Vokoma --packVersion '${{ steps.version.outputs.version }}' --packDir apps/client/build/windows/x64/runner/Release --mainExe VokomaLauncher.exe --outputDir release --channel win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vokoma-windows-x64
          path: apps/client/build/windows/x64/runner/Release/
          if-no-files-found: error
