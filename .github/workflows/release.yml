name: Release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without publishing
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  prepare:
    concurrency:
      group: release-debounce-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && format('dry-{0}', github.ref) || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      production: ${{ steps.trust.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: trust
        env:
          PRODUCTION: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          if [ "$PRODUCTION" = true ]; then node tools/release/trusted-ref.mjs; fi
          echo "production=$PRODUCTION" >> "$GITHUB_OUTPUT"
      - name: Batch main pushes for 30 minutes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 1800
      - run: node --test tools/release/release.test.mjs
      - id: version
        run: node tools/release/version.mjs
  server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile && pnpm check
        working-directory: server
      - run: docker build -f server/Dockerfile --build-arg VOKOMA_VERSION="$VOKOMA_VERSION" --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} -t vokoma-server:release .
        env:
          VOKOMA_VERSION: ${{ needs.prepare.outputs.version }}
      - run: node --test test/image.test.mjs
        working-directory: server
        env:
          IMAGE: vokoma-server:release
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      - run: docker save vokoma-server:release | gzip > server-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image
          path: server-image.tar.gz
          retention-days: 2
  client:
    needs: prepare
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/client
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/client/pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test
      - name: Build Android (debug-signed for dry runs, unsigned for production signing)
        if: runner.os == 'Linux'
        env:
          VOKOMA_UNSIGNED_APK: ${{ needs.prepare.outputs.production }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name '${{ needs.prepare.outputs.name }}' --build-number '${{ needs.prepare.outputs.build }}'
          mkdir -p ../../release
          cp build/app/outputs/flutter-apk/app-release.apk ../../release/Vokoma.apk
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release --build-name '${{ needs.prepare.outputs.name }}' --build-number '${{ needs.prepare.outputs.build }}'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows apply recovery
        if: runner.os == 'Windows'
        working-directory: .
        run: dotnet run --project tools/windows-updater/tests/RecoveryTests.csproj
      - name: Package per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          dotnet publish tools/windows-updater/Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o apps/client/build/windows/x64/runner/Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --tool-path .vpk vpk --version 1.2.161
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .vpk/vpk.exe pack --packId Vokoma --packVersion '${{ needs.prepare.outputs.version }}' --packDir apps/client/build/windows/x64/runner/Release --mainExe VokomaLauncher.exe --outputDir release --channel win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ runner.os }}
          path: release/
          if-no-files-found: error
          retention-days: 7
  dry-run:
    if: needs.prepare.outputs.production != 'true'
    needs: [prepare, server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Sign test metadata with a throwaway key (never production secrets)
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node tools/release/sign.mjs release --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dry-run-release-not-for-installation
          path: release/
          retention-days: 7
  publish:
    if: needs.prepare.outputs.production == 'true'
    needs: [prepare, server, client]
    runs-on: ubuntu-latest
    environment: release-signing
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check ancestry again before reading production secrets
        run: node tools/release/trusted-ref.mjs
      - name: Require the restricted signing environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release-signing" > "$RUNNER_TEMP/signing-environment.json"
          node -e "const e=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/signing-environment.json')); if (!e.deployment_branch_policy?.custom_branch_policies) throw Error('Configure release-signing with selected main branch and v* tag deployment policies first');"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign the APK with the production keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          signer=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD release/Vokoma.apk
          "$signer" verify --verbose release/Vokoma.apk
      - name: Authenticate update metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node tools/release/sign.mjs release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: server-image
      - name: Publish complete release before advancing image tags
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          node tools/release/publish.mjs
